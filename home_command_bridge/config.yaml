name: Home Command Bridge
version: "0.5.0"
slug: home_command_bridge
description: Securely connects Home Assistant to Home Command.
url: https://github.com/NationalSports/Home-Command-Bridge
arch:
  - aarch64
  - amd64
startup: application
boot: auto
init: false
homeassistant_api: true
apparmor: true
options:
  home_command_url: "https://residence-home-command.netlify.app"
  pairing_code: ""
  log_level: info
  sync_domains:
    - light
    - switch
    - climate
    - camera
    - media_player
    - lock
    - cover
    - sensor
    - binary_sensor
    - alarm_control_panel
    - weather
    - calendar
    - scene
    - automation
    - device_tracker
    - button
    - number
    - select
  camera_entities: []
schema:
  home_command_url: url
  pairing_code: str
  log_level: list(debug|info|warning|error)
  sync_domains:
    - str
  camera_entities:
    - str
